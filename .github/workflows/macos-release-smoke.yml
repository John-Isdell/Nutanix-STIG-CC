name: macOS release smoke

on:
  pull_request:
    paths:
      - ".github/workflows/macos-release-smoke.yml"
      - "Install-Control-Center.command"
      - "app/**"
      - "control_center.py"
      - "scripts/build_release.py"
      - "supervisor.py"
      - "supervisor_setup.py"

permissions:
  contents: read

jobs:
  install-uninstall:
    name: Install and uninstall packaged release
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Build release archives
        run: python scripts/build_release.py --version 1.3.0 --output dist

      - name: Exercise shipped macOS installer and uninstaller
        shell: bash
        env:
          BROWSER: /usr/bin/true
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/nutanix-release-smoke"
          archive="$GITHUB_WORKSPACE/dist/Nutanix-STIG-Control-Center-1.3.0-macos.zip"
          product="$smoke_root/Nutanix-STIG-Control-Center-1.3.0"
          plist="$HOME/Library/LaunchAgents/com.nutanix.stig-control-center.supervisor.plist"

          cleanup() {
            if [[ -d "$product" ]]; then
              (
                cd "$product"
                python3 control_center.py uninstall --force-stop || true
              )
            fi
          }
          trap cleanup EXIT

          mkdir -p "$smoke_root"
          unzip -q "$archive" -d "$smoke_root"
          cd "$product"
          ./Install-Control-Center.command

          python3 - <<'PY'
          import json
          import time
          from pathlib import Path
          from urllib.request import urlopen

          registration = Path(".runtime/supervisor-registration.json")
          deadline = time.monotonic() + 30
          health = None
          while time.monotonic() < deadline:
              try:
                  with urlopen("http://127.0.0.1:8765/api/health", timeout=1) as response:
                      health = json.load(response)
                  break
              except OSError:
                  time.sleep(0.5)
          if health is None:
              raise SystemExit("Supervisor health endpoint did not become ready")
          if health.get("status") != "ok" or health.get("local_only") is not True:
              raise SystemExit(f"Unexpected supervisor health: {health}")
          marker = json.loads(registration.read_text(encoding="utf-8"))
          if marker.get("kind") != "launchd user agent":
              raise SystemExit(f"Unexpected registration marker: {marker}")
          PY

          test -f "$plist"
          python3 control_center.py doctor
          python3 control_center.py uninstall
          test ! -e "$plist"
          test ! -e .runtime/supervisor-registration.json

          if curl --fail --silent --max-time 2 \
            http://127.0.0.1:8765/api/health >/dev/null; then
            echo "Supervisor remained reachable after uninstall" >&2
            exit 1
          fi

          trap - EXIT
